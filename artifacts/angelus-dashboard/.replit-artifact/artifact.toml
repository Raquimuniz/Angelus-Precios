kind = "web"
previewPath = "/"
title = "Angelus Price Intelligence Dashboard"
version = "1.0.0"
id = "artifacts/angelus-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20933

[services.development]
run = "pnpm --filter @workspace/angelus-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/angelus-dashboard", "run", "build" ]
publicDir = "artifacts/angelus-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20933"
BASE_PATH = "/"
